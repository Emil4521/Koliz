<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kolizéum — v0.2 — Équipement</title>
<style>
  :root {
    --bg: #14171d; --panel: #1c2029; --panel-2: #232833; --line: #333a47;
    --text: #dfe4ec; --muted: #8f9aad; --accent: #5aa9e6;
    --ok: #4cc38a; --ko: #e5484d; --warn: #f5a524;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ---------- Bandeau ---------- */
  header {
    flex: 0 0 auto; background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 10px 16px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  }
  h1 { font-size: 15px; margin: 0; letter-spacing: .2px; }
  h1 span { color: var(--muted); font-weight: 400; font-size: 12px; }
  .field { display: flex; align-items: center; gap: 7px; }
  .field label { color: var(--muted); white-space: nowrap; }
  input[type=number], input[type=text], select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 4px 7px; font: inherit;
  }
  input[type=number] { width: 68px; }
  input[type=range] { accent-color: var(--accent); }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 10px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: #fff; }
  button.primary { background: #24486a; border-color: #2f6595; }
  button.danger:hover { border-color: var(--ko); color: #fff; }

  #banner {
    flex: 0 0 auto; padding: 7px 16px; font-size: 12px;
    background: #3a2418; border-bottom: 1px solid #6b3f22; color: #f0c9a0;
  }
  #banner.hidden { display: none; }
  #banner b { color: var(--warn); }

  /* ---------- Colonnes ---------- */
  #cols { flex: 1 1 auto; display: flex; min-height: 0; }
  .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #colSlots { flex: 0 0 366px; border-right: 1px solid var(--line); }
  #colCatalog { flex: 1 1 auto; border-right: 1px solid var(--line); }
  #colStats { flex: 0 0 348px; }
  .col > h2 {
    flex: 0 0 auto; margin: 0; padding: 9px 14px;
    font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted); background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .col > .body { flex: 1 1 auto; overflow-y: auto; padding: 10px; }

  /* ---------- Emplacements ---------- */
  .slot {
    border: 1px solid var(--line); border-radius: 6px; margin-bottom: 7px;
    background: var(--panel); overflow: hidden;
  }
  .slot.active { border-color: var(--accent); }
  .slot-head {
    display: flex; align-items: center; gap: 8px; padding: 6px 9px;
    background: var(--panel-2); cursor: pointer;
  }
  .slot-head:hover { background: #2a3040; }
  .slot-name { flex: 1 1 auto; color: var(--muted); font-size: 11px;
               text-transform: uppercase; letter-spacing: .06em; }
  .slot-count { color: var(--muted); font: 11px ui-monospace, monospace; }
  .equipped { padding: 7px 9px; border-top: 1px solid var(--line); }
  .equipped + .equipped { border-top: 1px dashed var(--line); }
  .eq-title { display: flex; align-items: baseline; gap: 7px; }
  .eq-title b { font-weight: 600; }
  .eq-lvl { color: var(--muted); font-size: 11px; }
  .eq-actions { margin-left: auto; display: flex; gap: 4px; }
  .eq-actions button { padding: 1px 6px; font-size: 11px; }
  .empty-slot { padding: 7px 9px; color: #5c6577; font-style: italic; border-top: 1px solid var(--line); }

  .fx { margin: 4px 0 0; padding: 0; list-style: none; font: 12px ui-monospace, monospace; }
  .fx li { display: flex; align-items: center; gap: 6px; }
  .fx .val { color: var(--ok); min-width: 42px; }
  .fx .val.neg { color: var(--ko); }
  .fx .lbl { flex: 1 1 auto; color: var(--text); }
  .fx .rng { color: #5c6577; font-size: 11px; }
  .fx .bar { width: 34px; height: 4px; background: #2b313d; border-radius: 2px; overflow: hidden; }
  .fx .bar i { display: block; height: 100%; background: var(--accent); }
  .fx .unk { color: var(--warn); }
  .fx .tag {
    font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
    border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--muted);
  }
  .fx .tag.exo { border-color: #6b4fa8; color: #b39ddb; }
  .fx .tag.over { border-color: #8a6d1f; color: var(--warn); }

  /* ---------- Points de caractéristiques ---------- */
  #points { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); margin-bottom: 10px; }
  #points .head {
    display: flex; align-items: center; gap: 8px; padding: 6px 9px;
    background: var(--panel-2); font-size: 11px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted);
  }
  #points .head .left { flex: 1 1 auto; }
  #points .head .rem { font: 12px ui-monospace, monospace; color: var(--ok); text-transform: none; }
  #points .head .rem.none { color: var(--muted); }
  #points .body { padding: 6px 9px; }
  .prow { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .prow .name { flex: 1 1 auto; color: var(--muted); }
  .prow .val { font: 12px ui-monospace, monospace; min-width: 46px; text-align: right; color: var(--accent); }
  .prow input[type=number] { width: 62px; padding: 2px 5px; font: 12px ui-monospace, monospace; text-align: right; }
  .prow .cost { font: 10px ui-monospace, monospace; color: #5c6577; min-width: 40px; text-align: right; }
  .prow button { padding: 0 5px; font: 11px ui-monospace, monospace; }
  .prow button:disabled { opacity: .35; cursor: default; border-color: var(--line); }

  /* ---------- Forgemagie ---------- */
  .fm-row { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  .fm-row .lbl { flex: 1 1 auto; }
  .fm-row .rng { color: #5c6577; font: 11px ui-monospace, monospace; min-width: 64px; text-align: right; }
  .fm-row input[type=number] { width: 76px; }
  .fm-sep { border-top: 1px solid var(--line); margin: 10px 0 8px; padding-top: 8px; color: var(--muted); font-size: 11px; }

  /* ---------- Catalogue ---------- */
  #catalogTools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #search { flex: 1 1 160px; min-width: 120px; }
  .item {
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px;
    margin-bottom: 6px; background: var(--panel); cursor: pointer;
  }
  .item:hover { border-color: var(--accent); }
  .item.locked { opacity: .5; }
  .item-head { display: flex; align-items: baseline; gap: 8px; }
  .item-head b { flex: 0 1 auto; }
  .item-slot { color: var(--muted); font-size: 11px; }
  .item-set { color: var(--accent); font-size: 11px; margin-left: auto; }
  .item-lvl {
    font: 11px ui-monospace, monospace; color: var(--muted);
    border: 1px solid var(--line); border-radius: 3px; padding: 0 5px;
  }
  .item .req { color: var(--ko); font-size: 11px; margin-top: 3px; }
  .item .note { color: var(--warn); font-size: 11px; margin-top: 3px; }
  .weapon-line { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .muted { color: var(--muted); }
  .empty-msg { color: var(--muted); text-align: center; padding: 26px 10px; }

  /* ---------- Statistiques ---------- */
  .stat-group { margin-bottom: 14px; }
  .stat-group h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0 0 5px; padding-bottom: 4px;
    border-bottom: 1px solid var(--line);
  }
  table.stats { width: 100%; border-collapse: collapse; font: 12px ui-monospace, monospace; }
  table.stats td { padding: 1px 0; }
  table.stats td.lbl { color: var(--muted); }
  table.stats td.num { text-align: right; width: 52px; }
  table.stats td.detail {
    text-align: right; width: 124px; color: #5c6577;
    font-size: 10.5px; white-space: nowrap;   /* le détail ne doit jamais se replier */
  }
  table.stats tr.zero { display: none; }
  table.stats tr.zero.show { display: table-row; }
  .group-empty { color: #5c6577; font-size: 11.5px; font-style: italic; }
  .group-empty.hidden { display: none; }
  .life {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; margin-bottom: 12px;
  }
  .life .big { font-size: 21px; font-weight: 600; color: var(--ok); }
  .set-card {
    border: 1px solid #2f6595; background: #1b2735; border-radius: 6px;
    padding: 7px 9px; margin-bottom: 6px;
  }
  .set-card .name { color: var(--accent); font-weight: 600; }
  .set-card .pieces { color: var(--muted); font-size: 11px; }
  .warn-card {
    border: 1px solid #6b3f22; background: #2a1d14; border-radius: 6px;
    padding: 7px 9px; margin-bottom: 6px; font-size: 12px;
  }
  .warn-card .name { color: var(--warn); font-weight: 600; }
  textarea {
    width: 100%; height: 70px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 4px; padding: 6px;
    font: 11px/1.4 ui-monospace, monospace; resize: vertical;
  }
</style>
</head>
<body>

<header>
  <h1>Kolizéum <span>— v0.2 · équipement</span></h1>
  <span id="provenance" class="muted" title="Jeu de données actuellement chargé"></span>
  <div class="field">
    <label for="level">Niveau</label>
    <input type="number" id="level" min="1" max="200" value="200">
    <input type="range" id="levelRange" min="1" max="200" value="200">
  </div>
  <div class="field">
    <label for="quality">Jets</label>
    <select id="quality">
      <option value="random" selected>Aléatoires</option>
      <option value="1">Maximaux</option>
      <option value="0.5">Moyens</option>
      <option value="0">Minimaux</option>
    </select>
  </div>
  <div class="field">
    <label for="seed">Graine</label>
    <input type="text" id="seed" value="1" style="width:80px">
  </div>
  <button id="btnRerollAll">Relancer tout</button>
  <button id="btnClear" class="danger">Tout retirer</button>
  <button id="btnExport">Exporter</button>
  <button id="btnImport">Importer</button>
</header>

<div id="banner" class="hidden"></div>

<div id="cols">
  <div class="col" id="colSlots">
    <h2><span>Personnage</span><span id="slotSummary" class="muted"></span></h2>
    <div class="body">
      <div id="points"></div>
      <div id="slotsBody"></div>
    </div>
  </div>

  <div class="col" id="colCatalog">
    <h2>
      <span id="catalogTitle">Catalogue</span>
      <span id="catalogCount" class="muted"></span>
    </h2>
    <div class="body">
      <div id="catalogTools">
        <input type="text" id="search" placeholder="Rechercher un objet…">
        <select id="slotFilter"></select>
        <label class="field"><input type="checkbox" id="ignoreLevel"> <span class="muted">Ignorer le niveau</span></label>
        <select id="sort">
          <option value="level">Tri : niveau</option>
          <option value="name">Tri : nom</option>
        </select>
      </div>
      <div id="catalogList" style="margin-top:10px"></div>
    </div>
  </div>

  <div class="col" id="colStats">
    <h2>Statistiques</h2>
    <div class="body" id="statsBody"></div>
  </div>
</div>

<script src="items.js"></script>
<!-- Données officielles produites par scripts/fetch_items.js. Absentes tant que
     le script n'a pas tourné : le fichier d'exemple prend alors le relais. -->
<script src="data/items.data.js" onerror="window.KOLIZEUM_DATA_MISSING = true"></script>
<script src="data/items.sample.data.js"></script>
<script>
"use strict";

const Items = Kolizeum.Items;
const $ = (id) => document.getElementById(id);

const state = {
  data: null,
  loadout: Items.createLoadout(),
  level: 200,
  quality: "random",
  activeSlot: null,      // emplacement en cours de sélection
  search: "",
  ignoreLevel: false,
  sort: "level",
  rng: Items.makeRng("1"),
};

/* ==========================================================================
   Utilitaires d'affichage
   ========================================================================== */

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function signed(n) { return n > 0 ? `+${n}` : String(n); }

/**
 * Liste d'effets. Avec un exemplaire équipé (`entry`), on affiche les valeurs
 * réellement portées — lignes forgées et exotiques comprises ; sans lui, on
 * n'affiche que les fourchettes officielles du catalogue.
 */
function effectList(item, entry) {
  const ul = el("ul", "fx");
  const lignes = entry
    ? Items.effectiveEffects(item, entry)
    : item.effects.map((e) => ({ ...e, value: undefined, exotic: false, overmax: false }));

  for (const ligne of lignes) {
    const info = Items.describeEffect(ligne, state.data, ligne.value);
    const li = el("li");

    const val = el("span", "val", info.value != null ? signed(info.value) : `${ligne.min}~${ligne.max}`);
    if (info.value != null && info.value < 0) val.classList.add("neg");
    li.appendChild(val);

    const lbl = el("span", "lbl", info.label);
    if (!info.statKey) {
      lbl.classList.add("unk");
      lbl.title = "Effet non agrégé : sa signification n'est pas confirmée. "
                + "Il est affiché mais n'entre dans aucun total.";
      lbl.textContent += " ⚠";
    }
    li.appendChild(lbl);

    if (ligne.exotic) {
      const tag = el("span", "tag exo", "exo");
      tag.title = "Ligne ajoutée à la forge : l'objet ne la porte pas nativement.";
      li.appendChild(tag);
    } else if (ligne.overmax) {
      const tag = el("span", "tag over", "forgé");
      tag.title = `Valeur hors des bornes officielles (${ligne.min}–${ligne.max}).`;
      li.appendChild(tag);
    } else if (ligne.min !== ligne.max) {
      li.appendChild(el("span", "rng", `${ligne.min}–${ligne.max}`));
      if (info.value != null) {
        const bar = el("span", "bar");
        const fill = el("i");
        const ratio = (info.value - ligne.min) / (ligne.max - ligne.min);
        fill.style.width = `${Math.round(Math.max(0, Math.min(1, ratio)) * 100)}%`;
        bar.appendChild(fill);
        bar.title = `Jet : ${info.value} sur ${ligne.min}–${ligne.max}`;
        li.appendChild(bar);
      }
    }
    ul.appendChild(li);
  }
  return ul;
}

/* ==========================================================================
   Points de caractéristiques
   ========================================================================== */

function renderPoints() {
  const box = $("points");
  box.textContent = "";
  const dist = state.loadout.distribution;
  const dispo = Items.pointsAvailable(state.level);
  const depenses = Items.pointsSpent(dist);
  const restants = dispo - depenses;

  const head = el("div", "head");
  head.appendChild(el("span", "left", "Points de caractéristiques"));
  const rem = el("span", "rem" + (restants === 0 ? " none" : ""), `${restants} / ${dispo}`);
  rem.title = `${depenses} points dépensés au niveau ${state.level} — il reste ${restants} à attribuer`;
  head.appendChild(rem);
  box.appendChild(head);

  const body = el("div", "body");
  const parchotte = Boolean(state.loadout.scrolled);

  for (const stat of Items.POINT_STATS) {
    const valeur = dist[stat] || 0;
    const prix = Items.costOfNextPoint(stat, valeur);
    const bonus = parchotte && Items.SCROLLED_STATS.includes(stat) ? Items.SCROLL_VALUE : 0;

    const row = el("div", "prow");
    row.appendChild(el("span", "name", statLabel(stat)));

    // Saisie directe : on tape la valeur voulue plutôt que d'empiler les clics.
    const champ = el("input");
    champ.type = "number";
    champ.min = "0";
    champ.value = String(valeur);
    champ.title = "Points attribués à cette caractéristique";
    champ.addEventListener("change", () => {
      Items.setPoints(dist, stat, champ.value, state.level);
      render();
    });
    row.appendChild(champ);

    // Ce que le parchotage ajoute par-dessus, sans coûter de point.
    const tot = el("span", "val", bonus ? `= ${valeur + bonus}` : "");
    if (bonus) tot.title = `${valeur} par points + ${bonus} par parchemins`;
    row.appendChild(tot);

    const cout = el("span", "cost", `${prix} pt${prix > 1 ? "s" : ""}`);
    cout.title = "Coût du prochain point";
    row.appendChild(cout);

    for (const [texte, delta] of [["−10", -10], ["+10", 10]]) {
      const b = el("button", null, texte);
      b.disabled = delta < 0 ? valeur === 0 : prix > restants;
      b.addEventListener("click", () => {
        if (delta < 0) Items.refundPoints(dist, stat, -delta);
        else Items.spendPoints(dist, stat, delta, state.level);
        render();
      });
      row.appendChild(b);
    }
    body.appendChild(row);
  }

  // --- Parchemins ---
  const ligneParch = el("label", "check");
  ligneParch.style.cssText = "display:flex; align-items:center; gap:7px; margin:8px 0 6px; cursor:pointer";
  const caseParch = el("input");
  caseParch.type = "checkbox";
  caseParch.checked = parchotte;
  caseParch.style.accentColor = "var(--accent)";
  caseParch.addEventListener("change", () => {
    state.loadout.scrolled = caseParch.checked;
    render();
  });
  ligneParch.appendChild(caseParch);
  const texteParch = el("span", "muted",
    `Parchemins : +${Items.SCROLL_VALUE} dans les 4 éléments`);
  texteParch.title = "Ces points ne coûtent rien et n'entrent pas dans le calcul des paliers.";
  ligneParch.appendChild(texteParch);
  body.appendChild(ligneParch);

  const reset = el("button", null, "Réinitialiser la répartition");
  reset.addEventListener("click", () => {
    state.loadout.distribution = Items.createDistribution();
    render();
  });
  body.appendChild(reset);
  box.appendChild(body);
}

/** Libellé d'affichage d'une statistique agrégée. */
function statLabel(key) {
  for (const groupe of Items.STAT_GROUPS) {
    for (const [k, label] of groupe.stats) if (k === key) return label;
  }
  return key;
}

function weaponLine(item) {
  const w = item.weapon;
  if (!w) return null;
  const bits = [];
  if (w.apCost != null) bits.push(`${w.apCost} PA`);
  if (w.maxRange != null) bits.push(`portée ${w.minRange ?? 0}–${w.maxRange}`);
  if (w.criticalHitProbability) bits.push(`CC 1/${w.criticalHitProbability}`);
  if (w.criticalHitBonus) bits.push(`bonus CC ${w.criticalHitBonus}`);
  if (w.maxCastPerTurn) bits.push(`${w.maxCastPerTurn}×/tour`);
  if (w.twoHanded) bits.push("deux mains");
  return bits.length ? el("div", "weapon-line", bits.join(" · ")) : null;
}

/* ==========================================================================
   Rendu — emplacements
   ========================================================================== */

function renderSlots() {
  const body = $("slotsBody");
  body.textContent = "";
  let equippedCount = 0;

  for (const slot of Items.SLOT_ORDER) {
    const capacity = Items.SLOT_CAPACITY[slot];
    const entries = state.loadout.slots[slot];
    equippedCount += entries.length;

    const box = el("div", "slot" + (state.activeSlot === slot ? " active" : ""));

    const head = el("div", "slot-head");
    head.appendChild(el("span", "slot-name", Items.SLOT_LABELS[slot]));
    head.appendChild(el("span", "slot-count", `${entries.length}/${capacity}`));
    head.addEventListener("click", () => {
      state.activeSlot = state.activeSlot === slot ? null : slot;
      $("slotFilter").value = state.activeSlot || "";
      render();
    });
    box.appendChild(head);

    entries.forEach((entry, index) => {
      const item = state.data.itemById.get(entry.itemId);
      if (!item) return;
      const row = el("div", "equipped");

      const title = el("div", "eq-title");
      title.appendChild(el("b", null, item.name));
      title.appendChild(el("span", "eq-lvl", `niv. ${item.level}`));

      const actions = el("div", "eq-actions");
      const forge = el("button", null, "⚒");
      forge.title = "Forgemagie : modifier les valeurs, ajouter une ligne exotique";
      forge.addEventListener("click", (ev) => {
        ev.stopPropagation();
        openForge(item, entry);
      });

      const reroll = el("button", null, "↻");
      reroll.title = "Relancer les jets natifs (les lignes exotiques sont conservées)";
      reroll.addEventListener("click", (ev) => {
        ev.stopPropagation();
        Items.rerollEntry(entry, item, state.rng, qualityValue());
        render();
      });
      const remove = el("button", "danger", "✕");
      remove.title = "Retirer";
      remove.addEventListener("click", (ev) => {
        ev.stopPropagation();
        Items.unequip(state.loadout, slot, index);
        render();
      });
      actions.append(forge, reroll, remove);
      title.appendChild(actions);
      row.appendChild(title);

      const w = weaponLine(item);
      if (w) row.appendChild(w);
      row.appendChild(effectList(item, entry));
      box.appendChild(row);
    });

    for (let i = entries.length; i < capacity; i++) {
      box.appendChild(el("div", "empty-slot", "vide"));
    }
    body.appendChild(box);
  }

  const totalCapacity = Object.values(Items.SLOT_CAPACITY).reduce((a, b) => a + b, 0);
  $("slotSummary").textContent = `${equippedCount}/${totalCapacity} équipés`;
}

/* ==========================================================================
   Rendu — catalogue
   ========================================================================== */

function renderCatalog() {
  const list = $("catalogList");
  list.textContent = "";

  const criteria = { search: state.search, sort: state.sort };
  if (state.activeSlot) criteria.slot = state.activeSlot;
  if (!state.ignoreLevel) criteria.maxLevel = state.level;

  const items = Items.filterItems(state.data, criteria);
  $("catalogCount").textContent = `${items.length} objet${items.length > 1 ? "s" : ""}`;
  $("catalogTitle").textContent = state.activeSlot
    ? `Catalogue — ${Items.SLOT_LABELS[state.activeSlot]}`
    : "Catalogue";

  if (!items.length) {
    list.appendChild(el("div", "empty-msg", "Aucun objet ne correspond aux filtres."));
    return;
  }

  // Le rendu est borné : au-delà, la recherche est le bon outil.
  const shown = items.slice(0, 300);
  for (const item of shown) {
    const req = Items.checkRequirements(item, { level: state.level });
    const card = el("div", "item" + (req.ok ? "" : " locked"));

    const head = el("div", "item-head");
    head.appendChild(el("span", "item-lvl", String(item.level)));
    head.appendChild(el("b", null, item.name));
    head.appendChild(el("span", "item-slot", Items.SLOT_LABELS[item.slot] || item.slot));
    if (item.setId != null) {
      const set = state.data.setById.get(item.setId);
      if (set) head.appendChild(el("span", "item-set", set.name));
    }
    card.appendChild(head);

    const w = weaponLine(item);
    if (w) card.appendChild(w);
    card.appendChild(effectList(item, null));

    for (const problem of req.problems) card.appendChild(el("div", "req", problem));
    for (const note of req.notes) card.appendChild(el("div", "note", note));

    card.addEventListener("click", () => {
      if (!req.ok) return;
      const res = Items.equip(state.loadout, item, { rng: state.rng, quality: qualityValue() });
      if (!res.ok) { card.appendChild(el("div", "req", res.reason)); return; }
      render();
    });
    list.appendChild(card);
  }

  if (items.length > shown.length) {
    list.appendChild(el("div", "empty-msg",
      `${items.length - shown.length} objets supplémentaires — affinez la recherche.`));
  }
}

/* ==========================================================================
   Rendu — statistiques
   ========================================================================== */

function renderStats() {
  const body = $("statsBody");
  body.textContent = "";
  const s = Items.computeStats(state.loadout, state.data, { level: state.level, distribution: state.loadout.distribution, scrolled: state.loadout.scrolled });

  // Vie
  const life = el("div", "life");
  life.appendChild(el("div", "muted", "Points de vie"));
  life.appendChild(el("div", "big", String(s.life.total)));
  life.appendChild(el("div", "muted",
    `${s.life.base} de base + ${s.life.fromVitality} de vitalité`));
  body.appendChild(life);

  // Panoplies actives
  for (const set of s.sets) {
    const card = el("div", "set-card");
    card.appendChild(el("div", "name", set.name));
    card.appendChild(el("div", "pieces",
      `${set.pieces}/${set.totalItems} pièces — bonus du palier ${set.tier}`));
    const ul = el("ul", "fx");
    for (const e of set.effects) {
      const def = state.data.effects[e.effectId];
      const li = el("li");
      const val = el("span", "val", signed(e.value));
      if (e.value < 0) val.classList.add("neg");
      li.appendChild(val);
      li.appendChild(el("span", "lbl", (def && def.label) || `effet ${e.effectId}`));
      ul.appendChild(li);
    }
    card.appendChild(ul);
    body.appendChild(card);
  }

  // Effets non agrégés
  if (s.unaggregated.length) {
    const card = el("div", "warn-card");
    card.appendChild(el("div", "name", "Effets non cumulés"));
    card.appendChild(el("div", "muted",
      "Signification non confirmée : affichés, mais exclus des totaux."));
    const ul = el("ul", "fx");
    for (const u of s.unaggregated) {
      const li = el("li");
      li.appendChild(el("span", "val", signed(u.value)));
      li.appendChild(el("span", "lbl", `${u.label} — ${u.origin}`));
      ul.appendChild(li);
    }
    card.appendChild(ul);
    body.appendChild(card);
  }

  // Tableaux par groupe
  for (const group of Items.STAT_GROUPS) {
    const box = el("div", "stat-group");
    box.appendChild(el("h3", null, group.title));
    const table = el("table", "stats");
    let nonZero = 0;

    for (const [key, label] of group.stats) {
      const total = s.total[key];
      if (total !== 0) nonZero++;
      const tr = el("tr", total === 0 ? "zero" : null);
      tr.appendChild(el("td", "lbl", label));
      tr.appendChild(el("td", "num", total === 0 ? "—" : signed(total)));

      const parts = [];
      if (s.base[key]) parts.push(`${s.base[key]} base`);
      if (s.fromItems[key]) parts.push(`${signed(s.fromItems[key])} obj.`);
      if (s.fromSets[key]) parts.push(`${signed(s.fromSets[key])} pan.`);
      tr.appendChild(el("td", "detail", parts.join(" ")));
      table.appendChild(tr);
    }
    box.appendChild(table);
    // Un groupe entièrement nul afficherait un titre suivi de rien : on le dit.
    if (!nonZero) box.appendChild(el("div", "group-empty", "aucun bonus dans ce groupe"));
    body.appendChild(box);
  }

  const toggle = el("button", null, "Afficher les statistiques nulles");
  let showZeros = false;
  toggle.addEventListener("click", () => {
    showZeros = !showZeros;
    for (const tr of body.querySelectorAll("tr.zero")) tr.classList.toggle("show", showZeros);
    for (const node of body.querySelectorAll(".group-empty")) node.classList.toggle("hidden", showZeros);
    toggle.textContent = showZeros ? "Masquer les statistiques nulles" : "Afficher les statistiques nulles";
  });
  body.appendChild(toggle);
}

function render() {
  renderPoints();
  renderSlots();
  renderCatalog();
  renderStats();
}

/* ==========================================================================
   Contrôles
   ========================================================================== */

function qualityValue() {
  return state.quality === "random" ? null : Number(state.quality);
}

function setLevel(value) {
  state.level = Math.max(1, Math.min(200, Number(value) || 1));
  $("level").value = state.level;
  $("levelRange").value = state.level;
  render();
}

$("level").addEventListener("change", (e) => setLevel(e.target.value));
$("levelRange").addEventListener("input", (e) => setLevel(e.target.value));
$("quality").addEventListener("change", (e) => { state.quality = e.target.value; });
$("seed").addEventListener("change", (e) => { state.rng = Items.makeRng(e.target.value); });
$("search").addEventListener("input", (e) => { state.search = e.target.value; renderCatalog(); });
$("sort").addEventListener("change", (e) => { state.sort = e.target.value; renderCatalog(); });
$("ignoreLevel").addEventListener("change", (e) => { state.ignoreLevel = e.target.checked; renderCatalog(); });
$("slotFilter").addEventListener("change", (e) => {
  state.activeSlot = e.target.value || null;
  render();
});

$("btnClear").addEventListener("click", () => {
  state.loadout = Items.createLoadout();
  render();
});

$("btnRerollAll").addEventListener("click", () => {
  for (const slot of Items.SLOT_ORDER) {
    for (const entry of state.loadout.slots[slot]) {
      const item = state.data.itemById.get(entry.itemId);
      if (item) Items.rerollEntry(entry, item, state.rng, qualityValue());
    }
  }
  render();
});

$("btnExport").addEventListener("click", () => {
  const json = JSON.stringify(Items.exportLoadout(state.loadout, { level: state.level }));
  showIo(json, "Build exporté — copiez ce JSON.");
});

$("btnImport").addEventListener("click", () => {
  const box = showIo("", "Collez un JSON de build puis validez.");
  box.confirm.addEventListener("click", () => {
    try {
      const payload = JSON.parse(box.textarea.value);
      state.loadout = Items.importLoadout(payload);
      if (payload.character && payload.character.level) setLevel(payload.character.level);
      box.dialog.remove();
      render();
    } catch (err) {
      box.error.textContent = `JSON invalide : ${err.message}`;
    }
  });
});

/* ==========================================================================
   Forgemagie
   ========================================================================== */

/** Effets proposables en ligne exotique : ceux qui alimentent une statistique. */
function forgeableEffects() {
  const parLibelle = new Map();
  for (const def of Object.values(state.data.effects)) {
    if (!def.statKey || !def.label) continue;
    // Plusieurs identifiants partagent le même libellé : on garde le plus petit,
    // le choix étant sans conséquence puisque l'agrégation passe par statKey.
    const existant = parLibelle.get(def.label);
    if (!existant || def.id < existant.id) parLibelle.set(def.label, def);
  }
  return [...parLibelle.values()].sort((a, b) => a.label.localeCompare(b.label, "fr"));
}

/**
 * Éditeur de forgemagie d'un exemplaire équipé. Les valeurs ne sont pas
 * bornées : dépasser la fourchette officielle est signalé, jamais empêché.
 */
function openForge(item, entry) {
  const { dialog, panel } = makeDialog(`Forgemagie — ${item.name}`);

  const redessine = () => {
    corps.textContent = "";

    for (const ligne of Items.effectiveEffects(item, entry)) {
      const def = state.data.effects[ligne.effectId];
      const row = el("div", "fm-row");

      const lbl = el("span", "lbl", (def && def.label) || `effet ${ligne.effectId}`);
      if (ligne.exotic) lbl.appendChild(el("span", "tag exo", " exo"));
      row.appendChild(lbl);

      row.appendChild(el("span", "rng",
        ligne.exotic ? "libre" : `${ligne.min}–${ligne.max}`));

      const input = el("input");
      input.type = "number";
      input.value = ligne.value != null ? ligne.value : 0;
      input.addEventListener("change", () => {
        Items.setEffectValue(entry, ligne.effectId, input.value);
        redessine();
        render();
      });
      row.appendChild(input);

      if (ligne.exotic) {
        const del = el("button", "danger", "✕");
        del.title = "Retirer cette ligne";
        del.addEventListener("click", () => {
          Items.removeExoticEffect(entry, ligne.effectId);
          redessine();
          render();
        });
        row.appendChild(del);
      } else if (ligne.overmax) {
        const t = el("span", "tag over", "forgé");
        t.title = `Hors des bornes officielles (${ligne.min}–${ligne.max}).`;
        row.appendChild(t);
      }
      corps.appendChild(row);
    }

    // --- Ajout d'une ligne exotique ---
    corps.appendChild(el("div", "fm-sep", "Ajouter une ligne exotique"));

    const natifs = new Set((item.effects || []).map((e) => e.effectId));
    const deja = new Set(entry.exotic || []);
    const dispo = forgeableEffects().filter((d) => !natifs.has(d.id) && !deja.has(d.id));

    if (!dispo.length) {
      corps.appendChild(el("div", "muted", "Aucune caractéristique supplémentaire disponible."));
      return;
    }

    const ajout = el("div", "fm-row");
    const select = el("select");
    select.style.flex = "1 1 auto";
    for (const d of dispo) select.appendChild(new Option(d.label, String(d.id)));
    ajout.appendChild(select);

    const valeur = el("input");
    valeur.type = "number";
    valeur.value = "1";
    ajout.appendChild(valeur);

    const btn = el("button", "primary", "Ajouter");
    btn.addEventListener("click", () => {
      Items.addExoticEffect(entry, item, Number(select.value), valeur.value);
      redessine();
      render();
    });
    ajout.appendChild(btn);
    corps.appendChild(ajout);
  };

  const corps = el("div");
  panel.appendChild(corps);
  redessine();

  const pied = el("div");
  pied.style.cssText = "display:flex; gap:8px; justify-content:flex-end; margin-top:10px";
  const fermer = el("button", null, "Fermer");
  fermer.addEventListener("click", () => dialog.remove());
  pied.appendChild(fermer);
  panel.appendChild(pied);
}

/** Cadre de dialogue commun. */
function makeDialog(titre) {
  const existant = document.getElementById("ioDialog");
  if (existant) existant.remove();

  const dialog = el("div");
  dialog.id = "ioDialog";
  Object.assign(dialog.style, {
    position: "fixed", inset: "0", background: "#000a", display: "flex",
    alignItems: "center", justifyContent: "center", zIndex: "10",
  });

  const panel = el("div");
  Object.assign(panel.style, {
    background: "var(--panel)", border: "1px solid var(--line)", borderRadius: "8px",
    padding: "14px", width: "min(560px, 92vw)", maxHeight: "86vh", overflowY: "auto",
  });
  const h = el("div", null, titre);
  h.style.cssText = "font-weight:600; margin-bottom:10px";
  panel.appendChild(h);

  dialog.appendChild(panel);
  dialog.addEventListener("click", (ev) => { if (ev.target === dialog) dialog.remove(); });
  document.body.appendChild(dialog);
  return { dialog, panel };
}

/** Petite boîte de dialogue d'import/export, sans dépendance. */
function showIo(value, hint) {
  const existing = document.getElementById("ioDialog");
  if (existing) existing.remove();

  const dialog = el("div");
  dialog.id = "ioDialog";
  Object.assign(dialog.style, {
    position: "fixed", inset: "0", background: "#000a", display: "flex",
    alignItems: "center", justifyContent: "center", zIndex: "10",
  });

  const panel = el("div");
  Object.assign(panel.style, {
    background: "var(--panel)", border: "1px solid var(--line)", borderRadius: "8px",
    padding: "14px", width: "min(560px, 90vw)",
  });
  panel.appendChild(el("div", "muted", hint));

  const textarea = el("textarea");
  textarea.value = value;
  textarea.style.marginTop = "8px";
  panel.appendChild(textarea);

  const error = el("div", "req");
  panel.appendChild(error);

  const row = el("div");
  row.style.cssText = "display:flex; gap:8px; justify-content:flex-end; margin-top:8px";
  const confirm = el("button", "primary", "Importer");
  const close = el("button", null, "Fermer");
  close.addEventListener("click", () => dialog.remove());
  row.append(confirm, close);
  panel.appendChild(row);

  dialog.appendChild(panel);
  dialog.addEventListener("click", (ev) => { if (ev.target === dialog) dialog.remove(); });
  document.body.appendChild(dialog);
  textarea.select();
  return { dialog, textarea, confirm, error };
}

/* ==========================================================================
   Amorçage
   ========================================================================== */

function fillSlotFilter() {
  const select = $("slotFilter");
  select.appendChild(new Option("Tous les emplacements", ""));
  for (const slot of Items.SLOT_ORDER) {
    select.appendChild(new Option(Items.SLOT_LABELS[slot], slot));
  }
}

function showBanner(data) {
  const banner = $("banner");
  if (data.isSample) {
    banner.classList.remove("hidden");
    banner.innerHTML = "<b>Données d'exemple — fictives.</b> Ces objets sont inventés et "
      + "ne correspondent à aucun objet du jeu. Lancez <code>node scripts/fetch_items.js</code> "
      + "pour récupérer les données officielles depuis DofusDB.";
    return;
  }
  const warnings = (data.meta && data.meta.warnings) || [];
  if (warnings.length) {
    banner.classList.remove("hidden");
    banner.innerHTML = `<b>${warnings.length} avertissement(s) à l'extraction :</b> `
      + warnings.slice(0, 3).map((w) => String(w).replace(/</g, "&lt;")).join(" · ");
  }
}

/**
 * Récupère le jeu de données le plus frais disponible.
 *
 * Sur http(s) — GitHub Pages par exemple — on relit `data/items.json` en
 * contournant explicitement le cache. Le navigateur et le CDN servent
 * volontiers une version périmée de `items.data.js`, sans que rien ne
 * l'indique : on croit alors qu'une nouvelle extraction n'a pas été prise en
 * compte, alors que les données sont bien à jour côté dépôt.
 *
 * En file://, fetch() est interdit par la politique d'origine : on retombe sur
 * le global posé par la balise <script>, qui n'a pas ce problème puisque le
 * fichier est lu directement sur le disque.
 */
async function loadPayload() {
  if (location.protocol !== "file:") {
    try {
      const res = await fetch("data/items.json", { cache: "no-store" });
      if (res.ok) return await res.json();
    } catch (err) {
      // Repli silencieux : l'absence du fichier est normale tant que
      // l'extraction n'a pas tourné.
    }
  }
  return window.KOLIZEUM_ITEMS || null;
}

/** Affiche en clair le jeu de données chargé, pour lever tout doute. */
function showProvenance(data) {
  const meta = data.meta || {};
  const bits = [meta.source === "sample" ? "exemple" : (meta.source || "source inconnue")];
  bits.push(`${data.items.length} objets`);
  bits.push(`${data.sets.length} panoplie${data.sets.length > 1 ? "s" : ""}`);
  if (meta.generatedAt) {
    const d = new Date(meta.generatedAt);
    if (!Number.isNaN(d.getTime())) bits.push(`extrait le ${d.toLocaleString("fr-FR")}`);
  }
  $("provenance").textContent = bits.join(" · ");
}

async function boot() {
  const payload = await loadPayload();
  if (!payload) {
    document.body.innerHTML =
      '<div style="padding:40px; font: 14px/1.6 system-ui; color:#dfe4ec">'
      + "<h2>Aucune donnée chargée</h2>"
      + "<p>Générez un jeu de données avant d'ouvrir cette page :</p>"
      + "<pre style='background:#232833; padding:10px; border-radius:6px'>"
      + "node scripts/make_sample.js      # données d'exemple, sans réseau\n"
      + "node scripts/fetch_items.js      # données officielles (DofusDB)</pre></div>";
    return;
  }

  state.data = Items.indexData(payload);
  showBanner(state.data);
  showProvenance(state.data);
  fillSlotFilter();
  state.rng = Items.makeRng($("seed").value);
  setLevel(200);
}

boot();
</script>
